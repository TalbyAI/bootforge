name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke check built CLI
        run: npm run smoke

      - name: Verify tag matches package version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a supported semver release tag."
            exit 1
          fi

          package_version=$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; console.log(pkg.version);")
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "${package_version}" != "${tag_version}" ]]; then
            echo "Tag version ${tag_version} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish